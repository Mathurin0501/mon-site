<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon profil</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .avatar-zone { display: flex; align-items: center; gap: 20px; margin: 24px 0 32px; }
    .avatar {
      width: 84px; height: 84px; border-radius: 50%;
      background: var(--panel); border: 2px solid var(--panel-line);
      object-fit: cover; display: block;
    }
    .avatar-zone label {
      margin: 0;
      display: inline-block;
      background: var(--gold);
      color: #1a1408;
      padding: 9px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .avatar-zone input[type="file"] { display: none; }
  </style>
</head>
<body>
  <div class="app" id="app"></div>

  <script type="module">
    import { supabase } from './js/supabaseClient.js';
    import { construireSidebar, initSidebar, exigerConnexion } from './js/sidebar.js';

    const session = await exigerConnexion();

    document.getElementById('app').innerHTML = `
      ${construireSidebar('profil')}
      <main class="contenu">
        <p class="eyebrow">Fiche personnelle</p>
        <h1>Mon profil</h1>

        <div class="avatar-zone">
          <img id="avatarImg" class="avatar" src="" alt="Photo de profil">
          <div>
            <label for="avatarInput">Changer la photo</label>
            <input type="file" id="avatarInput" accept="image/*">
            <p id="avatarMessage" style="font-size: 12px; color: var(--muted); margin: 8px 0 0;"></p>
          </div>
        </div>

        <div class="fiche">
          <p><span>Nom</span><span id="nom"></span></p>
          <p><span>Prénom</span><span id="prenom"></span></p>
          <p><span>Âge</span><span id="age"></span></p>
        </div>
      </main>
    `;

    initSidebar();

    const { data: profil, error } = await supabase
      .from('profils')
      .select('nom, prenom, age, avatar_url')
      .eq('id', session.user.id)
      .single();

    const avatarImg = document.getElementById('avatarImg');

    function placeholderAvatar() {
      avatarImg.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" width="84" height="84"><rect width="84" height="84" fill="#22323b"/></svg>`
      );
    }

    if (error) {
      console.error('Erreur de récupération du profil :', error.message);
      placeholderAvatar();
    } else {
      document.getElementById('nom').textContent = profil.nom;
      document.getElementById('prenom').textContent = profil.prenom;
      document.getElementById('age').textContent = profil.age;
      avatarImg.src = profil.avatar_url || (placeholderAvatar(), avatarImg.src);
    }

    document.getElementById('avatarInput').addEventListener('change', async (e) => {
      const fichier = e.target.files[0];
      if (!fichier) return;

      const avatarMessage = document.getElementById('avatarMessage');
      avatarMessage.textContent = 'Envoi en cours...';

      const chemin = `${session.user.id}/avatar.png`;

      const { error: erreurUpload } = await supabase.storage
        .from('avatars')
        .upload(chemin, fichier, { upsert: true });

      if (erreurUpload) {
        avatarMessage.textContent = 'Erreur : ' + erreurUpload.message;
        return;
      }

      const { data: urlData } = supabase.storage.from('avatars').getPublicUrl(chemin);
      const urlAvecCache = urlData.publicUrl + '?t=' + Date.now();

      const { error: erreurMaj } = await supabase
        .from('profils')
        .update({ avatar_url: urlAvecCache })
        .eq('id', session.user.id);

      if (erreurMaj) {
        avatarMessage.textContent = 'Erreur : ' + erreurMaj.message;
        return;
      }

      avatarImg.src = urlAvecCache;
      avatarMessage.textContent = 'Photo mise à jour.';
    });
  </script>
</body>
</html>
